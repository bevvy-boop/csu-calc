<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">

    <header class="top">
      <h1 class="brand">CSU-CALC</h1>
      <div class="solar" aria-hidden="true"></div>
    </header>

    <section class="display" aria-label="Display">
      <div class="history" id="history">&nbsp;</div>
      <div class="result" id="result">0</div>
    </section>

    <section class="keys" aria-label="Keypad">
      <button class="clear" aria-label="Clear">C</button>
      <button class="operator" aria-label="Divide">÷</button>
      <button class="operator" aria-label="Multiply">×</button>
      <button class="operator" aria-label="Subtract">−</button>

      <button class="number">7</button>
      <button class="number">8</button>
      <button class="number">9</button>
      <button class="operator" aria-label="Add">+</button>

      <button class="number">4</button>
      <button class="number">5</button>
      <button class="number">6</button>
      <button class="equals" aria-label="Equals">=</button>

      <button class="number">1</button>
      <button class="number">2</button>
      <button class="number">3</button>
      <button class="number" aria-label="Decimal point">.</button>

      <button class="number zero">0</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
